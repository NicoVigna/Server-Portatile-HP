services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS:?Set DUCKDNS_SUBDOMAINS in .env}
      - TOKEN=${DUCKDNS_TOKEN:?Set DUCKDNS_TOKEN in .env}
    restart: unless-stopped